{% set name = "pytmc" %}
{% set version = "2.24.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pytmc/pytmc-{{ version }}.tar.gz
  sha256: d54f9e4271b3729f0302f3753211c7441237d9dbf4d28dd61740d2afb36b23b4

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv
  entry_points:
    - pytmc = pytmc.bin.pytmc:main

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
    - setuptools_scm
  run:
    - python >={{ python_min }}
    - jinja2
    - lxml
    - epics-pypdb >=0.1.5
  run_constrained:
    - pyqt =5

test:
  imports:
    - pytmc
  requires:
    - python {{ python_min }}
    - pytest
    - pytest-qt
    - qtpy
    - pyqt =5

about:
  home: https://github.com/pcdshub/pytmc
  doc_url: https://pcdshub.github.io/pytmc/
  license: LicenseRef-BSD-3-Clause-SLAC
  license_family: BSD
  license_file: LICENSE
  summary: Generate EPICS IOCs and records from Beckhoff TwinCAT projects

extra:
  recipe-maintainers:
    - conda-forge/pcdsdevices
